<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a1431">
<title>Para Ashanty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap">
<style>
/* Concepto: vista 3D a pantalla completa con baja resolución (PS1), HUD en las esquinas y caja de diálogo abajo como un RPG. Un solo mundo visual, por eso no hay modo claro/oscuro. */
:root{
  --ink:#2a1431;
  --pink:#ff8fc1;
  --rose:#ffd0e6;
  --gold:#ffd36e;
  --white:#fff7fb;
  --font:'Pixelify Sans','Courier New',monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--white);font:16px/1.35 var(--font);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,p{margin:0}
#stage{position:relative;width:100%;height:100%;overflow:hidden;background:#101028}
#view{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
#confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:25}
.panel{background:rgba(42,20,49,.86);border:3px solid var(--pink);box-shadow:4px 4px 0 rgba(0,0,0,.35)}

/* HUD */
#hud{position:absolute;top:12px;left:16px;right:16px;display:flex;flex-direction:column;gap:8px;pointer-events:none;z-index:5}
#hud[hidden]{display:none}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
#slots{display:flex;gap:6px;padding:6px}
.slot{width:36px;height:36px;display:grid;place-items:center;background:rgba(255,255,255,.08);border:2px solid rgba(255,208,230,.35)}
.slot canvas{width:26px;height:26px;image-rendering:pixelated;opacity:.18;filter:grayscale(1)}
.slot.on{border-color:var(--gold);background:rgba(255,211,110,.18)}
.slot.on canvas{opacity:1;filter:none}
.slot.pop{animation:pop .5s steps(5)}
.slot.gone{display:none}
@keyframes pop{50%{transform:scale(1.4)}}
.icon{pointer-events:auto;width:44px;height:44px;padding:0;display:grid;place-items:center;border:3px solid var(--pink);background:rgba(42,20,49,.86);box-shadow:4px 4px 0 rgba(0,0,0,.35)}
.icon svg{width:24px;height:24px}
#slash{display:none}
.muted #slash{display:block}
#clue{max-width:560px;padding:8px 12px;border-color:var(--gold);display:flex;gap:10px;align-items:baseline}
#clue b{color:var(--gold);letter-spacing:.14em;font-size:13px}
#clue.flash{animation:flash .9s steps(4) 2}
@keyframes flash{50%{background:rgba(255,211,110,.45)}}

/* Avisos y controles */
#prompt{position:absolute;left:50%;bottom:48px;transform:translateX(-50%);padding:6px 12px;border:3px solid var(--gold);background:rgba(42,20,49,.92);white-space:nowrap;z-index:6;pointer-events:none;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
#prompt kbd{font:inherit;color:var(--gold);margin-right:6px}
#hint{position:absolute;bottom:10px;left:16px;right:16px;text-align:center;font-size:14px;opacity:.85;pointer-events:none;text-shadow:2px 2px 0 var(--ink);z-index:4}
.ctl{display:none}
#joy{position:absolute;left:24px;bottom:28px;width:140px;height:140px;border-radius:50%;border:3px solid rgba(255,208,230,.6);background:rgba(42,20,49,.45);z-index:6;touch-action:none}
#thumb{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px;border-radius:50%;background:var(--pink);border:3px solid var(--ink)}
#btnA{position:absolute;right:28px;bottom:48px;width:88px;height:88px;border-radius:50%;background:var(--gold);color:var(--ink);border:4px solid var(--ink);box-shadow:4px 4px 0 var(--pink);font-size:34px;font-weight:700;place-items:center;z-index:6}
[data-mode="play"] #hint{display:block}
[data-mode]:not([data-mode="play"]) #hint{display:none}
@media (pointer:coarse){
  [data-mode="play"] #joy{display:block}
  [data-mode="play"] #btnA{display:grid}
  #hint{display:none!important}
  #prompt{bottom:190px}
}

/* Diálogo */
#dlg{position:absolute;left:16px;right:16px;bottom:16px;max-width:760px;margin:0 auto;padding:20px 18px 16px;min-height:112px;border:4px solid var(--pink);background:rgba(42,20,49,.95);box-shadow:5px 5px 0 rgba(0,0,0,.4);z-index:8}
#dlg[hidden]{display:none}
#who{position:absolute;top:-17px;left:12px;padding:2px 10px;background:var(--pink);color:var(--ink);font-weight:700;border:3px solid var(--ink)}
#dlgText{font-size:19px;line-height:1.4;padding-right:18px;min-height:2.8em}
#more{position:absolute;right:14px;bottom:12px;width:0;height:0;border:7px solid transparent;border-top-color:var(--gold);border-bottom:0;animation:blink .8s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

/* Tarjetas */
.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:rgba(20,8,28,.72);z-index:9;overflow:auto}
.overlay[hidden]{display:none}
.card{width:100%;max-width:380px;padding:20px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;border-color:var(--gold)}
.card small{color:var(--gold);letter-spacing:.14em;text-transform:uppercase;font-size:14px}
.card h2{font-size:26px;color:var(--rose);line-height:1.1;text-wrap:balance}
.card p{font-size:17px;text-wrap:balance}
#itemCv{width:160px;height:auto;image-rendering:pixelated;background:radial-gradient(circle,rgba(255,211,110,.35),transparent 70%);animation:bob 1.2s steps(4) infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.btn{padding:10px 22px;font-size:20px;font-weight:700;background:var(--gold);color:var(--ink);border:4px solid var(--ink);box-shadow:4px 4px 0 var(--pink)}
.btn.alt{background:var(--rose)}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--pink)}
.btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}

/* Candado */
#digits{display:flex;gap:10px}
.dg{display:flex;flex-direction:column;align-items:center;gap:6px}
.dg button{width:52px;height:36px;display:grid;place-items:center;background:var(--rose);color:var(--ink);border:3px solid var(--ink);padding:0}
.dg svg{width:18px;height:12px}
.dg output{width:52px;height:64px;display:grid;place-items:center;font-size:40px;font-weight:700;background:#150a1c;border:3px solid var(--gold);color:var(--gold)}
#lockMsg{min-height:1.3em;color:var(--rose)}
#digits.shake{animation:shake .4s steps(8)}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* Carta */
.paper{width:100%;max-width:560px;max-height:100%;overflow:auto;touch-action:pan-y;padding:24px 20px;background:#fff1f7;color:var(--ink);border:4px solid var(--pink);box-shadow:6px 6px 0 rgba(0,0,0,.4);display:flex;flex-direction:column;gap:18px}
.paper h2{font-size:30px;color:#d6347f}
#letterText{font-size:20px;line-height:1.55;white-space:pre-wrap;min-height:12em}

/* Fin */
#end h1{font-size:clamp(34px,9vw,64px);line-height:1;color:var(--rose);text-shadow:4px 4px 0 var(--ink),7px 7px 0 var(--pink);text-wrap:balance}
#end .card{max-width:520px;gap:16px}

/* Título */
#title{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end;gap:14px;padding:16px;padding-bottom:max(24px,9vh);background:linear-gradient(to top,rgba(42,20,49,.94) 0%,rgba(42,20,49,.6) 45%,rgba(42,20,49,0) 78%)}
#title[hidden]{display:none}
#title h1{font-size:clamp(46px,12vw,104px);line-height:.95;color:var(--rose);text-shadow:4px 4px 0 var(--ink),8px 8px 0 var(--pink);text-wrap:balance}
#title p{font-size:20px;max-width:30em;text-shadow:2px 2px 0 var(--ink)}
#title .btn{align-self:flex-start;font-size:26px;padding:12px 30px}
#fade{position:absolute;inset:0;background:#1a0d22;opacity:0;pointer-events:none;transition:opacity .5s steps(6);z-index:30}
#fade.on{opacity:1}
@media (max-width:520px){
  #hud{top:8px;left:12px;right:12px}
  .slot{width:34px;height:34px}
  #dlg{left:12px;right:12px;bottom:12px;min-height:100px;padding:18px 14px 14px}
  #dlgText{font-size:17px}
  .card h2{font-size:23px}
  #letterText{font-size:18px}
  .paper{padding:20px 16px}
  #title p{font-size:18px}
}
@media (max-height:480px){
  #hud{top:6px}
  #clue{padding:5px 10px;font-size:14px}
  #dlg{min-height:76px;padding:14px 14px 10px;bottom:8px}
  #dlgText{font-size:15px;min-height:2.6em}
  #joy{width:112px;height:112px;bottom:16px}
  #thumb{width:46px;height:46px;margin:-23px}
  #btnA{width:72px;height:72px;bottom:28px;font-size:28px}
  #prompt{bottom:110px!important}
  .card{padding:12px;gap:6px}
  #itemCv{width:100px}
}
@media (prefers-reduced-motion:reduce){#itemCv,#more,.slot.pop,#clue.flash{animation:none}}
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);background:#2a1431}
body{margin:0}
[hidden]{display:none!important}
</style>
</head>
<body>

<div id="stage" data-mode="title">
  <canvas id="view"></canvas>
  <canvas id="confetti"></canvas>

  <div id="hud" hidden>
    <div class="row">
      <div id="slots" class="panel" aria-label="Regalos encontrados"></div>
      <button id="mute" class="icon" type="button" aria-label="Sonido activado">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h4l5-4v14l-5-4H3z" fill="#ffd0e6"/><path d="M15 8q3 4 0 8M18 5q6 7 0 14" fill="none" stroke="#ffd0e6" stroke-width="2"/><path id="slash" d="M3 3l18 18" stroke="#ff8fc1" stroke-width="3"/></svg>
      </button>
    </div>
    <div id="clue" class="panel" hidden><b>PISTA</b><span id="clueText"></span></div>
  </div>

  <div id="prompt" hidden></div>
  <div id="hint">Moverse: WASD o flechas &nbsp;·&nbsp; Examinar: E o Espacio</div>
  <div id="joy" class="ctl"><div id="thumb"></div></div>
  <button id="btnA" class="ctl" type="button" aria-label="Examinar">A</button>

  <div id="dlg" hidden><div id="who"></div><p id="dlgText"></p><i id="more"></i></div>

  <div id="item" class="overlay" hidden>
    <div class="card panel">
      <small id="itemTag">Regalo encontrado</small>
      <canvas id="itemCv" width="8" height="8"></canvas>
      <h2 id="itemName"></h2>
      <p id="itemDesc"></p>
      <button id="itemOk" class="btn" type="button">Seguir</button>
    </div>
  </div>

  <div id="lock" class="overlay" hidden>
    <div class="card panel">
      <small>Baúl con candado</small>
      <p>Cuatro números. ¿Qué fecha importa aquí?</p>
      <div id="digits"></div>
      <p id="lockMsg"></p>
      <div class="btns">
        <button id="lockOk" class="btn" type="button">Abrir</button>
        <button id="lockCancel" class="btn alt" type="button">Cerrar</button>
      </div>
    </div>
  </div>

  <div id="letter" class="overlay" hidden>
    <div class="paper">
      <h2 id="letterTo"></h2>
      <p id="letterText"></p>
      <div class="btns"><button id="letterSkip" class="btn" type="button">Seguir</button></div>
    </div>
  </div>

  <div id="end" class="overlay" hidden>
    <div class="card panel">
      <h1>Feliz cumpleaños, Ashanty</h1>
      <div class="btns">
        <button id="readAgain" class="btn alt" type="button">Leer la carta</button>
        <button id="replay" class="btn" type="button">Jugar otra vez</button>
      </div>
    </div>
  </div>

  <div id="title">
    <h1>Para<br>Ashanty</h1>
    <p>Un juego hecho con cariño por Carlos. Encuentra los regalos y sigue las pistas.</p>
    <button id="play" class="btn" type="button">Jugar</button>
    <p style="font-size:15px;opacity:.85">Mejor con sonido.</p>
  </div>
  <div id="fade"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* ============ TEXTOS Y DATOS (editables) ============ */
const CONFIG = {
  name: 'Ashanty',
  from: 'Carlos',
  code: '1010',
  gifts: {
    bear:     { name: 'Osito de peluche',  desc: 'Suave, abrazable y listo para cuidarte.' },
    necklace: { name: 'Collar de corazón', desc: 'Para que lleves un pedacito de mí contigo.' },
    album:    { name: 'Álbum de fotos',    desc: 'Un lugar para guardar todos nuestros recuerdos.' },
    perfume:  { name: 'Perfume',           desc: 'Para que huelas tan bien como brillas.' },
    key:      { name: 'Llave dorada',      desc: 'Abre la puerta de la casa.' }
  },
  letter:
    'Feliz cumpleaños mi amor, me alegro de que Dios te haya dado la oportunidad de cumplir un año más de vida, le agradezco a Dios por haberte mantenido sana, cuerda y saludable.\n\n' +
    'Eres mi tesoro, la persona que más me importa y amo en toda mi vida, y con la persona que no podría vivir si me falta.\n\n' +
    'Le pido a Dios que te siga cuidando como lo ha estado haciendo, que te ayude en todo lo que necesites, que te permita lograr todo lo que te propongas porque eres alguien que se merece todo, más que el cielo.\n\n' +
    'Te amo y espero que tengas un día lleno de felicidad y cosas bonitas.\n\n' +
    'Felices 20, amor de mi vida.\n\n' +
    '— Carlos'
};

const $ = (s) => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
function lerpAngle(a, b, t) {
  let d = ((b - a + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI;
  return a + d * t;
}
function rng(seed) { let s = seed % 2147483647; if (s <= 0) s += 2147483646; return () => (s = s * 16807 % 2147483647) / 2147483647; }

/* ============ RENDER (baja resolución estilo PS1) ============ */
const canvas = $('#view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 200);
let aspectK = 1, portraitF = 0;
function resize() {
  const st = $('#stage');
  const w = Math.max(1, st.clientWidth), h = Math.max(1, st.clientHeight);
  const ps = Math.max(2, Math.round(Math.min(w, h) / 260));
  renderer.setSize(Math.max(1, Math.floor(w / ps)), Math.max(1, Math.floor(h / ps)), false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  const ar = w / h;
  aspectK = ar < 1.3 ? 1 + (1.3 - ar) * 0.45 : 1;
  portraitF = clamp((1.2 - ar) / 0.6, 0, 1);
  camera.fov = lerp(50, 66, portraitF);
  camera.updateProjectionMatrix();
}

/* ============ TEXTURAS PIXELADAS ============ */
function tex(w, h, draw, rx, ry) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.magFilter = THREE.NearestFilter;
  t.minFilter = THREE.NearestFilter;
  t.generateMipmaps = false;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rx || 1, ry || 1);
  return t;
}
function noise(g, w, h, base, vars, n, seed) {
  const r = rng(seed || 7);
  g.fillStyle = base; g.fillRect(0, 0, w, h);
  for (let i = 0; i < n; i++) {
    g.fillStyle = vars[Math.floor(r() * vars.length)];
    g.fillRect(Math.floor(r() * w), Math.floor(r() * h), 1, 1);
  }
}

/* ============ MATERIALES Y FORMAS ============ */
function mat(color, extra) {
  return new THREE.MeshPhongMaterial(Object.assign({ color, flatShading: true, shininess: 0, specular: 0x000000 }, extra || {}));
}
function matT(map, extra) { return new THREE.MeshLambertMaterial(Object.assign({ map }, extra || {})); }
function glow(color) { return new THREE.MeshBasicMaterial({ color }); }
function box(w, h, d, m) { return new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); }
function cyl(rt, rb, h, seg, m) { return new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), m); }
function cone(r, h, seg, m) { return new THREE.Mesh(new THREE.ConeGeometry(r, h, seg), m); }
function ball(r, m, ws, hs) { return new THREE.Mesh(new THREE.SphereGeometry(r, ws || 8, hs || 6), m); }
function ico(r, m) { return new THREE.Mesh(new THREE.IcosahedronGeometry(r, 0), m); }
function place(o, x, y, z) { o.position.set(x, y, z); return o; }
function blob(r) {
  const m = new THREE.Mesh(new THREE.CircleGeometry(r, 10), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.28, depthWrite: false }));
  m.rotation.x = -Math.PI / 2; m.position.y = 0.03;
  return m;
}
function heartMesh(s, m) {
  const g = new THREE.Group();
  g.add(box(s, s, s * 0.3, m));
  g.children[0].rotation.z = Math.PI / 4;
  const a = cyl(s / 2, s / 2, s * 0.3, 10, m), b = a.clone();
  a.rotation.x = b.rotation.x = Math.PI / 2;
  a.position.set(-s * 0.35, s * 0.35, 0); b.position.set(s * 0.35, s * 0.35, 0);
  g.add(a, b);
  g.rotation.z = 0;
  return g;
}
function glint(x, y, z) {
  const m = new THREE.Mesh(new THREE.OctahedronGeometry(0.22, 0), glow(0xffe27a));
  m.position.set(x, y, z);
  m.userData.base = y;
  return m;
}
function giftBox(color, ribbon) {
  const g = new THREE.Group();
  g.add(place(box(0.9, 0.7, 0.9, mat(color)), 0, 0.35, 0));
  g.add(place(box(0.95, 0.74, 0.18, mat(ribbon)), 0, 0.35, 0));
  g.add(place(box(0.18, 0.74, 0.95, mat(ribbon)), 0, 0.35, 0));
  g.add(place(ico(0.2, mat(ribbon)), -0.18, 0.82, 0), place(ico(0.2, mat(ribbon)), 0.18, 0.82, 0));
  return g;
}

/* ============ MUNDOS ============ */
function newWorld(bg, fogNear, fogFar) {
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(bg);
  if (fogNear) scene.fog = new THREE.Fog(bg, fogNear, fogFar);
  return {
    scene, bounds: { x0: -10, x1: 10, z0: -10, z1: 10 }, boxes: [], spots: [], tick: [],
    cam: { off: [0, 9, 11], look: [0, 1.2, 0], fx: 1, fz: 1 },
    add(o) { scene.add(o); return o; },
    solid(x, z, w, d) { this.boxes.push({ x, z, w, d }); },
    spot(x, z, r, label, use, enabled) { const s = { x, z, r, label, use, enabled }; this.spots.push(s); return s; }
  };
}
function lights(scene, ambCol, ambI, sunCol, sunI, pos) {
  scene.add(new THREE.AmbientLight(ambCol, ambI));
  const d = new THREE.DirectionalLight(sunCol, sunI);
  d.position.set(pos[0], pos[1], pos[2]);
  scene.add(d);
}
function collide(world, p, r) {
  const b = world.bounds;
  p.x = clamp(p.x, b.x0 + r, b.x1 - r);
  p.z = clamp(p.z, b.z0 + r, b.z1 - r);
  for (const bx of world.boxes) {
    const hx = bx.w / 2, hz = bx.d / 2;
    const cx = clamp(p.x, bx.x - hx, bx.x + hx), cz = clamp(p.z, bx.z - hz, bx.z + hz);
    const dx = p.x - cx, dz = p.z - cz, d2 = dx * dx + dz * dz;
    if (d2 < r * r) {
      if (d2 > 1e-6) { const d = Math.sqrt(d2); p.x = cx + dx / d * r; p.z = cz + dz / d * r; }
      else {
        const ox = hx - Math.abs(p.x - bx.x), oz = hz - Math.abs(p.z - bx.z);
        if (ox < oz) p.x = bx.x + (p.x >= bx.x ? 1 : -1) * (hx + r);
        else p.z = bx.z + (p.z >= bx.z ? 1 : -1) * (hz + r);
      }
    }
  }
}

/* ============ ENTRADA ============ */
const keys = new Set();
const joyVec = { x: 0, z: 0 };
function getMove() {
  let x = 0, z = 0;
  if (keys.has('arrowleft') || keys.has('a')) x -= 1;
  if (keys.has('arrowright') || keys.has('d')) x += 1;
  if (keys.has('arrowup') || keys.has('w')) z -= 1;
  if (keys.has('arrowdown') || keys.has('s')) z += 1;
  x += joyVec.x; z += joyVec.z;
  const l = Math.hypot(x, z);
  if (l < 0.15) return { x: 0, z: 0 };
  if (l > 1) { x /= l; z /= l; }
  return { x, z };
}
(function setupJoystick() {
  const joy = $('#joy'), thumb = $('#thumb');
  let active = false;
  function move(e) {
    const r = joy.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    let dx = e.clientX - cx, dy = e.clientY - cy;
    const max = r.width * 0.38, d = Math.hypot(dx, dy);
    if (d > max) { dx *= max / d; dy *= max / d; }
    joyVec.x = dx / max; joyVec.z = dy / max;

const Snd = {
  ctx: null, master: null, on: true, i: 0, timer: 0,
  init() {
    if (!this.ctx) {
      try {
        const A = window.AudioContext || window.webkitAudioContext;
        this.ctx = new A(); this.master = this.ctx.createGain();
        this.master.gain.value = 0.5; this.master.connect(this.ctx.destination);
      } catch (e) { this.ctx = null; }
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  tone(f, t0, dur, type, vol) {

    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type || 'triangle'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol || 0.12, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  now() { return this.ctx ? this.ctx.currentTime : 0; },
  hz(n) { return 523.25 * Math.pow(2, n / 12); },
  blip() { this.tone(900 + Math.random() * 200, this.now(), 0.05, 'square', 0.04); },
  step() { this.tone(110 + Math.random() * 30, this.now(), 0.07, 'triangle', 0.08); },
  pickup() { const t = this.now(); [0, 4, 7, 12, 16].forEach((n, i) => this.tone(this.hz(n), t + i * 0.09, 0.35, 'square', 0.07)); },
  ok() { const t = this.now(); [7, 12, 16, 19].forEach((n, i) => this.tone(this.hz(n), t + i * 0.1, 0.5, 'triangle', 0.12)); },
  bad() { const t = this.now(); this.tone(200, t, 0.15, 'square', 0.07); this.tone(150, t + 0.15, 0.25, 'square', 0.07); },
  fanfare() { const t = this.now(); [0, 4, 7, 12, 7, 12, 16, 19, 24].forEach((n, i) => this.tone(this.hz(n), t + i * 0.13, 0.5, 'triangle', 0.14)); },
  startMusic() {
    if (this.timer || !this.ctx) return;
    const mel = [0,4,7,12, 7,4,7,4, 5,9,12,16, 12,9,12,9, 7,11,14,19, 14,11,14,11, 4,7,9,12, 9,7,4,0];
    const bass = [-24, -19, -17, -24];

      const i = this.i++ % 32, t = this.now();
      this.tone(this.hz(mel[i]), t, 0.9, 'sine', 0.06);
      if (i % 8 === 0) this.tone(this.hz(bass[i / 8]), t, 2.2, 'sine', 0.07);
    }, 360);
  },
  setOn(v) {
    this.on = v;
    if (this.master) this.master.gain.value = v ? 0.5 : 0;

};

function makeChar(o) {
  const g = new THREE.Group();

  g.add(blob(0.7));

  const legs = [];
  for (const s of [-1, 1]) {
    const p = new THREE.Group(); p.position.set(s * 0.17, 0.5, 0);
    p.add(place(box(0.2, 0.36, 0.22, o.skirt ? skin : bottom), 0, -0.18, 0));
    p.add(place(box(0.24, 0.14, 0.34, shoe), 0, -0.43, 0.05));
    body.add(p); legs.push(p);
  }
  if (o.skirt) {
    body.add(place(cyl(0.3, 0.52, 0.72, 7, top), 0, 0.84, 0));
    body.add(place(cyl(0.535, 0.535, 0.06, 7, mat(0xffffff)), 0, 0.5, 0));
  } else {
    body.add(place(box(0.66, 0.72, 0.42, top), 0, 0.86, 0));
  }
  const arms = [];
  for (const s of [-1, 1]) {
    const p = new THREE.Group(); p.position.set(s * 0.42, 1.14, 0);
    p.add(place(box(0.2, 0.26, 0.22, top), 0, -0.12, 0));
    p.add(place(box(0.17, 0.28, 0.19, skin), 0, -0.36, 0));
    body.add(p); arms.push(p);
  }

  const head = new THREE.Group(); head.position.set(0, 1.78, 0); body.add(head);
  head.add(ball(0.62, skin, 10, 8));
  const R = 0.62;
  const zOn = (x, y) => Math.sqrt(Math.max(0.01, R * R - x * x - y * y));
  for (const s of [-1, 1]) {
    head.add(place(box(0.09, 0.14, 0.05, dark), s * 0.2, 0.02, zOn(s * 0.2, 0.02) + 0.01));
    head.add(place(box(0.03, 0.04, 0.03, mat(0xffffff)), s * 0.2 + 0.015, 0.06, zOn(s * 0.2, 0.06) + 0.03));
    const bw = o.beard ? 0.18 : 0.15, bh = o.beard ? 0.045 : 0.03;
    head.add(place(box(bw, bh, 0.04, dark), s * 0.2, 0.2, zOn(s * 0.2, 0.2) + 0.01));
    if (o.blush) head.add(place(box(0.13, 0.07, 0.03, mat(0xff7a9c, { transparent: true, opacity: 0.75 })), s * 0.33, -0.12, zOn(s * 0.33, -0.12) + 0.005));
  }
  head.add(place(box(0.07, 0.08, 0.07, mat(o.skin === 0x8a5638 ? 0x7a4a30 : 0xc4875f)), 0, -0.06, zOn(0, -0.06) + 0.02));
  head.add(place(box(0.15, 0.045, 0.04, mat(o.lips)), 0, -0.2, zOn(0, -0.2) + 0.01));
  if (o.beard) {
    head.add(place(box(0.22, 0.035, 0.04, dark), 0, -0.145, zOn(0, -0.145) + 0.025));
    head.add(place(box(0.08, 0.05, 0.04, dark), 0, -0.29, zOn(0, -0.29) + 0.005));
  }

  /* lentes */
  const frame = mat(o.frame);
  for (const s of [-1, 1]) {
    let ring;
    if (o.glasses === 'round') {
      ring = new THREE.Mesh(new THREE.TorusGeometry(0.15, 0.026, 5, 12), frame);
    } else {
      ring = new THREE.Mesh(new THREE.TorusGeometry(0.2, 0.026, 4, 4), frame);
      ring.rotation.z = Math.PI / 4; ring.scale.set(1.25, 0.85, 1);
    }
    ring.position.set(s * 0.2, 0.03, zOn(s * 0.2, 0.03) + 0.04);
    head.add(ring);
    head.add(place(box(0.03, 0.03, 0.34, frame), s * 0.405, 0.04, 0.38));
  }
  head.add(place(box(0.1, 0.03, 0.03, frame), 0, 0.05, zOn(0, 0.05) + 0.05));

  /* pelo */
  if (o.hairStyle === 'long') {
    const cap = new THREE.Mesh(new THREE.SphereGeometry(0.665, 10, 6, 0, Math.PI * 2, 0, Math.PI * 0.5), hair);
    cap.position.set(0, 0.04, -0.03); cap.rotation.x = -0.42; head.add(cap);
    const shellMat = mat(o.hair, { side: THREE.DoubleSide });
    const shell = new THREE.Mesh(new THREE.CylinderGeometry(0.66, 0.5, 1.5, 9, 1, true, Math.PI / 2, Math.PI), shellMat);
    shell.position.set(0, -0.25, -0.02); head.add(shell);
    for (const s of [-1, 1]) {
      head.add(place(box(0.17, 1.0, 0.3, hair), s * 0.6, -0.42, 0.02));
      head.add(place(box(0.2, 0.5, 0.26, hair), s * 0.55, 0.12, 0.05));
    }
    [-0.3, -0.15, 0, 0.15, 0.3].forEach((x, i) => {
      const b = box(0.15, 0.3, 0.07, hair);
      b.position.set(x, 0.3 - Math.abs(x) * 0.2, zOn(x, 0.3) + 0.03);
      b.rotation.y = x * 1.3; b.rotation.z = -x * 0.4;
      head.add(b);
    });
  } else {
    const cap = new THREE.Mesh(new THREE.SphereGeometry(0.645, 9, 6, 0, Math.PI * 2, 0, Math.PI * 0.46), hair);
    cap.position.set(0, 0.02, -0.02); cap.rotation.x = -0.3; head.add(cap);
    const r = rng(11), cols = [mat(0x0f0f13), mat(0x1c1c25), mat(0x0a0a0d)];
    const n = 38;
    for (let i = 0; i < n; i++) {
      const az = i * 2.399, t = (i + 1) / n;
      const f = (1 + Math.cos(az)) / 2;
      const maxP = 1.7 - 0.62 * f;
      const pol = Math.sqrt(t) * maxP;
      const rad = 0.67 + r() * 0.04;
      const c = ico(0.095 + r() * 0.05, cols[i % 3]);
      c.position.set(rad * Math.sin(pol) * Math.sin(az), rad * Math.cos(pol) + 0.03, rad * Math.sin(pol) * Math.cos(az));
      c.rotation.set(r() * 3, r() * 3, r() * 3);
      head.add(c);
    }
  }

  g.userData = { body, head, legs, arms, phase: 0, lastStep: 0 };
  g.userData.walk = (dt, speed, t) => {
    const u = g.userData, k = clamp(speed / 3, 0, 1);
    if (speed > 0.25) u.phase += dt * speed * 2.4;
    const s = Math.sin(u.phase) * k * 0.9;
    legs[0].rotation.x = s; legs[1].rotation.x = -s;
    if (!u.pose) { arms[0].rotation.x = -s * 0.9; arms[1].rotation.x = s * 0.9; }
    body.position.y = Math.abs(Math.sin(u.phase)) * 0.07 * k;
    head.position.y = 1.78 + Math.sin(t * 2.2) * 0.012;
    head.rotation.z = Math.sin(u.phase * 0.5) * 0.04 * k;
  };
  return g;
}

  /* letrero */
  const signTex = tex(64, 24, (g, w, h) => {

  /* pasto, florcitas sueltas */

    W.add(b); flies.push(b);
  });

    const u = b.userData, a = t * 0.7 + u.ph;
    b.position.set(u.cx + Math.cos(a) * 1.8, 1.3 + Math.sin(t * 1.3 + u.ph) * 0.3, u.cz + Math.sin(a * 1.3) * 1.2);

  for (let i = 0; i < 6; i++) {
    const c = new THREE.Group(), cm = glow(0xffffff);
    for (let k = 0; k < 4; k++) { const b = ico(2 + (k % 2), cm); b.position.set(k * 2.2 - 3, (k % 2) * 0.6, 0); b.scale.y = 0.55; c.add(b); }
    c.position.set(-40 + i * 16, 20 + (i % 3) * 3, -30 - (i % 2) * 8);
    W.add(c); clouds.push(c);
  }
  W.tick.push((t, dt) => clouds.forEach((c) => { c.position.x += dt * 0.6; if (c.position.x > 50) c.position.x = -50; }));

  W.glints = [W.necklaceGlint, W.mailGlint, W.keyGlint];
  W.glints.forEach((gl) => gl.userData.on = true);
  W.tick.push((t) => W.glints.forEach((gl, i) => { gl.rotation.y = t * 2 + i; gl.position.y = gl.userData.base + Math.sin(t * 3 + i) * 0.08; }));
  return W;
}

/* ============ BUCLE ============ */
let snapCamera = true, clock = 0, last = performance.now();
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3(), desired = new THREE.Vector3(), desiredLook = new THREE.Vector3();

function updatePlayer(dt, canMove) {
  const m = canMove ? getMove() : { x: 0, z: 0 };
  const sp = 4.6;
  vel.x += (m.x * sp - vel.x) * Math.min(1, dt * 12);
  vel.z += (m.z * sp - vel.z) * Math.min(1, dt * 12);
  pos.x += vel.x * dt; pos.z += vel.z * dt;
  collide(S.world, pos, 0.45);
  const speed = Math.hypot(vel.x, vel.z);
  if (speed > 0.3) face = lerpAngle(face, Math.atan2(vel.x, vel.z), Math.min(1, dt * 14));
  player.group.position.set(pos.x, 0, pos.z);
  player.group.rotation.y = face;
  const u = player.group.userData;
  u.walk(dt, speed, clock);
  const st = Math.floor(u.phase / Math.PI);
  if (speed > 0.5 && st !== u.lastStep) { u.lastStep = st; Snd.step(); }
}
function updateSpots() {
  if (S.mode !== 'play') return;
  let best = null, bd = 1e9;
  for (const s of S.world.spots) {
    if (s.enabled && !s.enabled()) continue;
    const d = Math.hypot(pos.x - s.x, pos.z - s.z);
    if (d < s.r && d < bd) { best = s; bd = d; }
  }
  if (best !== S.near) {
    S.near = best; const p = $('#prompt');
    if (best) { p.innerHTML = (touch ? '<kbd>A</kbd>' : '<kbd>E</kbd>') + best.label; p.hidden = false; } else p.hidden = true;
  }
}
function updateCamera(dt) {
  const w = S.world;
  if (S.mode === 'title') {
    const a = clock * 0.12;
    desired.set(Math.sin(a) * 19, 8.5, -2 + Math.cos(a) * 19); desiredLook.set(0, 1.5, -2);
  } else if (S.camOverride) {
    desired.copy(S.camOverride.pos); desiredLook.copy(S.camOverride.look);
  } else {
    const c = w.cam, k = aspectK;
    const tx = pos.x * c.fx, tz = pos.z * c.fz;
    desired.set(tx + c.off[0] * k, c.off[1] * (0.85 + 0.15 * k), tz + c.off[2] * k);
    desiredLook.set(tx + c.look[0], c.look[1], tz + c.look[2] + portraitF * 2.4);
  }
  const t = snapCamera ? 1 : 1 - Math.exp(-dt * (S.camOverride ? 2.2 : 5));
  camPos.lerp(desired, t); camLook.lerp(desiredLook, t); snapCamera = false;
  camera.position.copy(camPos); camera.lookAt(camLook);
}
function fadeTrees(dt) {
  const w = S.world; if (!w.trees) return;
  const cx = camera.position.x, cy = camera.position.y, cz = camera.position.z;
  for (const t of w.trees) {
    const p = t.g.position, s = t.g.userData.s;
    const frac = (p.z - pos.z) / (cz - pos.z || 1);
    let occ = false;
    if (frac > -0.05 && frac < 1) {
      const lx = lerp(pos.x, cx, frac), ly = lerp(1.2, cy, frac);
      occ = Math.abs(p.x - lx) < 3.0 * s && ly < 7 * s;
    }
    t.op += ((occ ? 0.22 : 1) - t.op) * Math.min(1, dt * 8);
    t.mats.forEach((m) => { m.opacity = t.op; m.depthWrite = t.op > 0.95; });
  }
}
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; clock += dt;
  S.world.tick.forEach((f) => f(clock, dt));
  updatePlayer(dt, S.mode === 'play');
  if (carlos) carlos.userData.walk(dt, 0, clock);
  if (S.mode === 'play') {
    updateSpots();
    if (S.world === worlds.terrace && Math.hypot(pos.x, pos.z + 8.2) < 2.7) startEnding();
  }
  if (S.mode === 'dialog' && dlg.typing) {
    dlg.pos += dt * 46;
    const n = Math.floor(dlg.pos);
    $('#dlgText').textContent = dlg.text.slice(0, n);
    if (n % 3 === 0) Snd.blip();
    if (n >= dlg.text.length) { dlg.typing = false; $('#dlgText').textContent = dlg.text; $('#more').style.visibility = 'visible'; }
  }
  if (S.mode === 'cut' && S.world === worlds.terrace) face = lerpAngle(face, Math.PI, Math.min(1, dt * 6));
  updateCamera(dt);
  fadeTrees(dt);
  drawConfetti(dt);
  renderer.render(S.world.scene, camera);
  requestAnimationFrame(frame);
}

/* ============ ACCIÓN ============ */
function pressAction() {
  Snd.init();
  if (S.mode === 'play' && S.near) S.near.use();
  else if (S.mode === 'dialog') advanceDialog();
  else if (S.mode === 'item') closeItem();
}
addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k)) e.preventDefault();
  if (e.repeat) return;
  keys.add(k);
  if ((k === 'e' || k === ' ' || k === 'enter') && !(e.target && e.target.tagName === 'BUTTON')) pressAction();
});
addEventListener('keyup', (e) => keys.delete(e.key.toLowerCase()));
addEventListener('blur', () => keys.clear());
$('#btnA').addEventListener('click', pressAction);

/* ============ INICIO ============ */
function boot() {
  worlds.garden = buildGarden();
  worlds.room = buildRoom();
  worlds.terrace = buildTerrace();
  player = { group: makeAshanty() };
  carlos = makeCarlos(true); carlos.position.set(0, 0, -8.2); worlds.terrace.add(carlos);
  worlds.terrace.solid(0, -8.2, 1.0, 1.0);
  setupSpots();
  S.world = worlds.garden; enterWorld('garden'); refreshGlints();
  camPos.set(0, 8.5, 17); camLook.set(0, 1.5, -2);
  addEventListener('resize', resize); resize();
  if (window.ResizeObserver) new ResizeObserver(resize).observe($('#stage'));
  requestAnimationFrame((t) => { last = t; frame(t); });
}
$('#play').addEventListener('click', () => {
  Snd.init(); Snd.startMusic(); Snd.ok();
  $('#title').hidden = true; $('#hud').hidden = false;
  enterWorld('garden'); refreshGlints();
  setMode('play');
  say([
    [CONFIG.from, '¡Hola, ' + CONFIG.name + '! Hoy es un día muy especial.'],
    [CONFIG.from, 'Escondí 4 regalos por el jardín y por la casa. Cada uno trae una pista para encontrar el siguiente.'],
    [CONFIG.from, touch ? 'Muévete con el joystick y toca el botón A para examinar las cosas.' : 'Muévete con las flechas o WASD. Cerca de algo, presiona E o Espacio para examinarlo.'],
    [CONFIG.from, 'Empieza por el buzón, cerca de la entrada. Al final te espera una sorpresa.']
  ], () => setClue('Lee la carta del buzón, cerca de la entrada del jardín.'));
});
boot();

</script>
